categories:
  - name: "product_fit"
    fields:
      - name: "human_login_experience"
        description: "扫码、验证方式选择、短信验证码、滑块和未知页面是否都由用户在真实网页完成"
        detail_level: "详细"
      - name: "installation_and_recovery"
        description: "首次安装、协议唤起、升级、断线、休眠、重启和卸载体验"
        detail_level: "详细"
      - name: "multi_account_isolation"
        description: "同平台多账号是否使用独立 Profile，是否会串 Cookie 或选错账号"
        detail_level: "详细"
  - name: "authorization_model"
    fields:
      - name: "credential_residency"
        description: "Cookie、Token、Storage 留在设备、上传阿里云或进入第三方浏览器云"
        detail_level: "详细"
      - name: "credential_portability"
        description: "凭据能否跨设备、跨 IP、跨浏览器环境复用；是否存在设备绑定"
        detail_level: "详细"
      - name: "auth_health_semantics"
        description: "区分凭据存在、仍登录、接口可用和具备目标权限"
        detail_level: "详细"
  - name: "execution_model"
    fields:
      - name: "execution_location"
        description: "后续发布、采集和同步在云端、边缘设备或用户电脑执行"
        detail_level: "详细"
      - name: "offline_and_scheduling"
        description: "用户设备离线时定时任务是否可运行，以及失败恢复语义"
        detail_level: "详细"
      - name: "session_lease_and_concurrency"
        description: "同账号串行、Tab/Profile 租约、冲突、幂等和超时"
        detail_level: "详细"
  - name: "security"
    fields:
      - name: "permission_scope"
        description: "扩展权限是否按需申请到单个平台域名，是否使用 debugger、cookies 或 all_urls"
        detail_level: "详细"
      - name: "pairing_and_device_identity"
        description: "一次性票据、设备密钥、签名、吊销、重配和审计"
        detail_level: "详细"
      - name: "local_attack_surface"
        description: "localhost daemon、Native Messaging、CDP、恶意网页和恶意本地进程的防护"
        detail_level: "详细"
      - name: "credential_minimization"
        description: "按域名与名称白名单提取凭据，不输出到页面、日志或通用插件"
        detail_level: "详细"
  - name: "platform_adapter"
    fields:
      - name: "declarative_contract"
        description: "登录 URL、允许重定向域名、成功信号、凭据白名单和健康检查是否为声明式配置"
        detail_level: "详细"
      - name: "unknown_verification_compatibility"
        description: "平台改变验证流程时是否仍可由用户在真实网页完成，而无需新增坐标或选择器"
        detail_level: "详细"
      - name: "platform_acceptance"
        description: "逐平台真实扫码、二次验证、重启、多账号、撤销和低量操作证据"
        detail_level: "详细"
  - name: "engineering"
    fields:
      - name: "upstream_churn"
        description: "OpenCLI、Playwright、Chrome 与扩展协议变更及版本锁定成本"
        detail_level: "详细"
      - name: "distribution"
        description: "Chrome Web Store、中国网络、macOS 公证、Windows 签名与自动更新"
        detail_level: "详细"
      - name: "migration_scope"
        description: "现有 API、Worker、cookieRef、browser-runner 和登录 UI 的保留、替换与回滚边界"
        detail_level: "详细"
uncertain:
  - "抖音及后续平台的登录凭据是否允许从本地 Chrome 迁移到阿里云执行，必须逐平台真实验证"
  - "设备绑定会话普及后，Cookie 回传模式可能失效，应保留本地执行模式"
  - "OpenCLI 2.x 与扩展版本近期变化快，PoC 必须固定 CLI、扩展和协议版本"
  - "纯扩展难以自动创建和管理多个隔离 Chrome Profile，多账号场景可能需要 Native Host"
  - "Chrome Web Store 在中国网络和企业环境中的安装、更新可达性需实测"
