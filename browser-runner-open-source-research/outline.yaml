topic: "AI Growth Ops 多平台网站扫码授权与浏览器执行架构"
current_date: "2026-10-21"
items:
  - name: "专用本地 Browser Authorization Bridge"
    priority: "P0"
    role: "推荐目标架构；启动本机真实 Chrome，按平台账号隔离 Profile，用户直接完成扫码和二次验证"
  - name: "OpenCLI Browser Bridge 2.x"
    priority: "P0-poc"
    role: "PoC 与参考实现；复用真实 Chrome、多 Profile 和浏览器桥能力，不直接作为生产安全边界"
  - name: "Playwright Chrome Extension"
    priority: "P0-reference"
    role: "官方连接现有 Chrome 的对照实现；参考逐连接批准、Token、Tab Group 和 Profile 选择"
  - name: "Chrome Extension + Native Messaging Host"
    priority: "P0-reference"
    role: "本地 Bridge 的推荐通信方式；避免把通用 localhost HTTP/CDP 端口暴露给网页和本地其他进程"
  - name: "纯 Chrome Extension"
    priority: "P1"
    role: "单账号授权最轻，但难以自动管理多个相互隔离的 Chrome Profile"
  - name: "本地执行且凭据不出设备"
    priority: "P0"
    role: "适合设备绑定会话；云端下发受限任务，本地只回传业务结果和证据"
  - name: "本地授权后回传可迁移凭据"
    priority: "P0-conditional"
    role: "仅在逐平台真实验证 Cookie/Token 可跨设备和跨 IP 使用后启用"
  - name: "官方 OAuth / Device Authorization"
    priority: "P1"
    role: "平台提供且能力足够时优先作为可选路径，不强制替代网页扫码"
  - name: "现有阿里云 browser-runner"
    priority: "migration-fallback"
    role: "保留发布、采集和已验证的云端执行；不继续扩建登录截图和半套远程桌面"
  - name: "托管或自建远程浏览器 Live View"
    priority: "P2"
    role: "无需本地安装但基础设施重；只作为纯 Web 和无人值守场景的例外方案"
  - name: "PinchTab"
    priority: "excluded"
    role: "仍需服务器 Chromium 和自建交互层，没有解决当前重量、交互和稳定性根因"
execution:
  batch_size: 1
  items_per_agent: 11
  output_dir: "./browser-runner-open-source-research/results"
