name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ai-growth-ops/database db:generate

      - name: Build shared packages
        # 按目录通配构建全部 workspace 包，避免新增包后清单失修（如 ai-tools）
        run: pnpm --filter './packages/**' run --if-present build

      - name: Typecheck all packages
        run: |
          pnpm --filter @ai-growth-ops/api typecheck
          pnpm --filter @ai-growth-ops/worker typecheck
          pnpm --filter @ai-growth-ops/web typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r exec eslint . --max-warnings=0 || true
        # Allow lint to pass with warnings during initial setup

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ai-growth-ops/database db:generate

      - name: Build all packages
        # 按目录通配构建全部 workspace 包，避免新增包后清单失修（如 ai-tools）
        run: pnpm --filter './packages/**' run --if-present build

      - name: Build API
        run: pnpm --filter @ai-growth-ops/api build

      - name: Build Worker
        run: pnpm --filter @ai-growth-ops/worker build

      - name: Build Web
        run: pnpm --filter @ai-growth-ops/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
